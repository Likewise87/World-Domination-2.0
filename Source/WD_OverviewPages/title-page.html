<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World Domination 2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #07080c;
      --text: #e8eef6;
      --silver: #d7dee8;
      --red: #e1262a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-deep);
      color: var(--text);
      font-family: "Rajdhani", sans-serif;
      font-weight: 600;
      line-height: 1.35;
      width: 1920px;
      height: 1080px;
    }

    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 90% 55% at 50% 8%, rgba(30, 55, 90, 0.35), transparent 55%),
        radial-gradient(ellipse 70% 50% at 50% 100%, rgba(12, 20, 36, 0.9), transparent 60%),
        radial-gradient(circle at 20% 30%, rgba(3, 182, 205, 0.05), transparent 25%),
        radial-gradient(circle at 80% 20%, rgba(225, 38, 42, 0.05), transparent 22%),
        var(--bg-deep);
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      pointer-events: none;
      opacity: 0.55;
      background-image:
        radial-gradient(1px 1px at 8% 12%, rgba(255,255,255,0.85), transparent),
        radial-gradient(1px 1px at 22% 48%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1.5px 1.5px at 41% 18%, rgba(255,255,255,0.75), transparent),
        radial-gradient(1px 1px at 63% 72%, rgba(255,255,255,0.45), transparent),
        radial-gradient(1px 1px at 78% 28%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1.5px 1.5px at 91% 61%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 14% 81%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 52% 39%, rgba(255,255,255,0.65), transparent),
        radial-gradient(1px 1px at 33% 66%, rgba(255,255,255,0.35), transparent),
        radial-gradient(1px 1px at 71% 9%, rgba(255,255,255,0.55), transparent);
      z-index: 0;
      animation: starPulse 8s ease-in-out infinite;
    }

    @keyframes starPulse {
      0%, 100% { opacity: 0.42; }
      50% { opacity: 0.68; }
    }

    .page {
      position: relative;
      z-index: 1;
      width: 1920px;
      height: 1080px;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .brand h1 {
      margin: 0;
      font-family: "Orbitron", sans-serif;
      font-weight: 800;
      font-size: 7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      color: var(--silver);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
      line-height: 1.1;
    }

    .brand h1 .dom {
      color: var(--red);
      text-shadow:
        0 0 10px rgba(225, 38, 42, 0.75),
        0 0 28px rgba(225, 38, 42, 0.35),
        0 2px 12px rgba(0, 0, 0, 0.65);
    }

    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
    }

    @media print {
      body { background: #07080c; }
      body::before { display: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="brand">
      <h1>WORLD <span class="dom">DOMINATION</span> 2.0</h1>
    </header>
  </div>
</body>
</html>
