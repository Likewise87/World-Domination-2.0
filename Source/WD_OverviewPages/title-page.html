<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>World Domination 2.0</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #07080c;
      --border: rgba(120, 170, 210, 0.28);
      --border-strong: rgba(3, 182, 205, 0.4);
      --text: #e8eef6;
      --text-muted: #9aa8b8;
      --cyan: #03b6cd;
      --silver: #d7dee8;
      --red: #e1262a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-deep);
      color: var(--text);
      font-family: "Rajdhani", sans-serif;
      font-weight: 600;
      line-height: 1.35;
      width: fit-content;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 90% 55% at 50% 8%, rgba(30, 55, 90, 0.35), transparent 55%),
        radial-gradient(ellipse 70% 50% at 50% 100%, rgba(12, 20, 36, 0.9), transparent 60%),
        radial-gradient(circle at 20% 30%, rgba(3, 182, 205, 0.05), transparent 25%),
        radial-gradient(circle at 80% 20%, rgba(225, 38, 42, 0.05), transparent 22%),
        var(--bg-deep);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.55;
      background-image:
        radial-gradient(1px 1px at 8% 12%, rgba(255,255,255,0.85), transparent),
        radial-gradient(1px 1px at 22% 48%, rgba(255,255,255,0.55), transparent),
        radial-gradient(1.5px 1.5px at 41% 18%, rgba(255,255,255,0.75), transparent),
        radial-gradient(1px 1px at 63% 72%, rgba(255,255,255,0.45), transparent),
        radial-gradient(1px 1px at 78% 28%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1.5px 1.5px at 91% 61%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 14% 81%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 52% 39%, rgba(255,255,255,0.65), transparent),
        radial-gradient(1px 1px at 33% 66%, rgba(255,255,255,0.35), transparent),
        radial-gradient(1px 1px at 71% 9%, rgba(255,255,255,0.55), transparent);
      z-index: 0;
      animation: starPulse 8s ease-in-out infinite;
    }

    @keyframes starPulse {
      0%, 100% { opacity: 0.42; }
      50% { opacity: 0.68; }
    }

    .page {
      position: relative;
      z-index: 1;
      width: 860px;
      max-width: 860px;
      margin: 0;
      padding: 64px 28px 56px;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .mark {
      position: relative;
      width: 168px;
      height: 168px;
      margin: 0 auto 40px;
      animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .mark::before {
      content: "";
      position: absolute;
      inset: -18%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(3, 182, 205, 0.22), transparent 68%);
      filter: blur(10px);
      animation: glowBreathe 5s ease-in-out infinite;
    }

    .orb {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(3, 182, 205, 0.55);
      box-shadow:
        inset 0 0 28px rgba(3, 182, 205, 0.12),
        0 0 24px rgba(3, 182, 205, 0.18);
      background:
        radial-gradient(circle at 35% 28%, rgba(232, 238, 246, 0.14), transparent 42%),
        radial-gradient(circle at 50% 55%, rgba(3, 182, 205, 0.16), rgba(7, 8, 12, 0.85) 70%);
    }

    .ring {
      position: absolute;
      inset: 14%;
      border-radius: 50%;
      border: 1px solid rgba(215, 222, 232, 0.22);
    }

    .ring-outer {
      position: absolute;
      inset: -8%;
      border-radius: 50%;
      border: 1px solid rgba(3, 182, 205, 0.22);
      animation: spin 28s linear infinite;
    }

    .ring-outer span {
      position: absolute;
      top: 50%;
      left: 0;
      width: 7px;
      height: 7px;
      margin-top: -3.5px;
      margin-left: -3.5px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px rgba(3, 182, 205, 0.8);
    }

    .cross {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 54%;
      height: 54%;
      transform: translate(-50%, -50%);
    }

    .cross::before,
    .cross::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(225, 38, 42, 0.85);
      box-shadow: 0 0 10px rgba(225, 38, 42, 0.45);
    }

    .cross::before {
      width: 1px;
      height: 100%;
      transform: translate(-50%, -50%);
    }

    .cross::after {
      width: 100%;
      height: 1px;
      transform: translate(-50%, -50%);
    }

    .brand {
      animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
    }

    .brand h1 {
      margin: 0;
      font-family: "Orbitron", sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 4.2vw, 3.1rem);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--silver);
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65);
      line-height: 1.15;
    }

    .brand h1 .dom {
      color: var(--red);
      text-shadow:
        0 0 10px rgba(225, 38, 42, 0.75),
        0 0 28px rgba(225, 38, 42, 0.35),
        0 2px 12px rgba(0, 0, 0, 0.65);
    }

    .rule {
      width: 96px;
      height: 1px;
      margin: 28px auto 0;
      border: 0;
      background: linear-gradient(90deg, transparent, var(--border-strong), transparent);
      animation: riseIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
    }

    @keyframes riseIn {
      from {
        opacity: 0;
        transform: translateY(14px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes glowBreathe {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      .page {
        width: 100vw;
        max-width: 100vw;
        padding: 48px 18px;
      }

      .brand h1 {
        letter-spacing: 0.06em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body::before,
      .mark,
      .mark::before,
      .ring-outer,
      .brand,
      .rule {
        animation: none;
      }
    }

    @media print {
      body { background: #07080c; }
      body::before { display: none; }
      .page { max-width: none; min-height: auto; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="mark" aria-hidden="true">
      <div class="ring-outer"><span></span></div>
      <div class="orb"></div>
      <div class="ring"></div>
      <div class="cross"></div>
    </div>

    <header class="brand">
      <h1>WORLD <span class="dom">DOMINATION</span> 2.0</h1>
    </header>

    <hr class="rule" />
  </div>
</body>
</html>
