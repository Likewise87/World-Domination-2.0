site_name: World Domination 2.0
site_url: https://likewise87.github.io/World-Domination-2.0/
site_author: TSA
site_description: Comprehensive player guide for the RimWorld mod World Domination 2.0 by TSA
repo_url: https://github.com/Likewise87/World-Domination-2.0
repo_name: Likewise87/World-Domination-2.0
edit_uri: edit/main/docs/
copyright: Published under <a href="https://creativecommons.org/licenses/by-nc/4.0/" target="_blank" rel="noopener">Creative Commons Attribution-NonCommercial (CC BY-NC 4.0)</a>

extra:
  generator: false

theme:
  name: material
  custom_dir: overrides
  palette:
    scheme: slate
    primary: custom
    accent: custom
  font: false
  features:
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy

extra_css:
  - stylesheets/wd-theme.v15.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: false
      title: On this page

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - World generation: concepts/world-generation.md
      - Strength and tiers: concepts/strength-and-tiers.md
